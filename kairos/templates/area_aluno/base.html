<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Kairos{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/tokens.css?v={{ asset_ver }}">
  <link rel="stylesheet" href="/static/css/base.css?v={{ asset_ver }}">
  <link rel="stylesheet" href="/static/css/cadastro.css?v={{ asset_ver }}">
  <link rel="stylesheet" href="/static/css/area_aluno.css?v={{ asset_ver }}">
  {% block head_extra %}{% endblock %}
</head>
<body>
  {% set p = request.url.path %}
  <canvas id="fundo3d" aria-hidden="true"></canvas>
  <div id="fundo3d-scrim" aria-hidden="true"></div>

  <header class="cad-top cad-top-aluno">
    <a class="word" href="/aluno">Kair<span class="o">o</span>s</a>
    <form method="post" action="/logout" class="logout-form">
      <button type="submit" class="logout-btn">Sair</button>
    </form>
  </header>

  <nav class="aluno-nav" aria-label="Navegação da sua área">
    <a class="aluno-nav-link{% if p == '/aluno' %} is-active{% endif %}" href="/aluno">Início</a>
    <a class="aluno-nav-link{% if p.startswith('/aluno/checkin') %} is-active{% endif %}" href="/aluno/checkin">Check-in</a>
    <a class="aluno-nav-link{% if p.startswith('/aluno/registro') %} is-active{% endif %}" href="/aluno/registro">Registro</a>
    <a class="aluno-nav-link{% if p.startswith('/aluno/perfil') %} is-active{% endif %}" href="/aluno/perfil">Perfil</a>
    <a class="aluno-nav-link{% if p.startswith('/aluno/treinos') %} is-active{% endif %}" href="/aluno/treinos">Treinos</a>
    <a class="aluno-nav-link{% if p.startswith('/aluno/nivel') %} is-active{% endif %}" href="/aluno/nivel">Nível</a>
    <a class="aluno-nav-link{% if p.startswith('/aluno/avaliacoes') %} is-active{% endif %}" href="/aluno/avaliacoes">Avaliações</a>
    <a class="aluno-nav-link{% if p.startswith('/aluno/agenda') %} is-active{% endif %}" href="/aluno/agenda">Agenda</a>
    <a class="aluno-nav-link{% if p.startswith('/aluno/financeiro') %} is-active{% endif %}" href="/aluno/financeiro">Financeiro</a>
    <a class="aluno-nav-link{% if p.startswith('/aluno/acompanhamento') %} is-active{% endif %}" href="/aluno/acompanhamento">Acompanhamento</a>
    <a class="aluno-nav-link{% if p.startswith('/aluno/mensagens') %} is-active{% endif %}" href="/aluno/mensagens">Contato</a>
  </nav>

  <main class="cad-main">
    {% block content %}{% endblock %}
  </main>

  <script type="module" src="/static/js/painel-fundo.js?v={{ asset_ver }}"></script>
</body>
</html>
