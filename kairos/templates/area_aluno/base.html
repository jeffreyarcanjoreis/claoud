<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Kairos{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/tokens.css?v={{ asset_ver }}">
  <link rel="stylesheet" href="/static/css/base.css?v={{ asset_ver }}">
  <link rel="stylesheet" href="/static/css/cadastro.css?v={{ asset_ver }}">
  <link rel="stylesheet" href="/static/css/area_aluno.css?v={{ asset_ver }}">
  {% block head_extra %}{% endblock %}
</head>
<body>
  <canvas id="fundo3d" aria-hidden="true"></canvas>
  <div id="fundo3d-scrim" aria-hidden="true"></div>

  <header class="cad-top cad-top-aluno">
    <a class="word" href="/aluno">Kair<span class="o">o</span>s</a>
    <form method="post" action="/logout" class="logout-form">
      <button type="submit" class="logout-btn">Sair</button>
    </form>
  </header>

  <main class="cad-main">
    {% block content %}{% endblock %}
  </main>

  <script type="module" src="/static/js/painel-fundo.js?v={{ asset_ver }}"></script>
</body>
</html>
