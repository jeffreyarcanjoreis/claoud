{% extends "alunos/ficha_layout.html" %}

{% block ficha_content %}
<h2>Editar exercício</h2>
<p class="card-line-dim">{{ item.exercicio_nome }}</p>

{% if error %}
<div class="message-error">{{ error }}</div>
{% endif %}

<form method="post" action="/alunos/{{ aluno.id }}/treino/{{ treino.id }}/itens/{{ item.id }}">
    <div class="field">
        <label for="fase">Fase</label>
        <select id="fase" name="fase">
            <option value="">—</option>
            {% for valor, label in fase_opcoes %}
            <option value="{{ valor }}" {% if item.fase == valor %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="field-row">
        <div class="field">
            <label for="series">Séries</label>
            <input type="number" inputmode="numeric" id="series" name="series" min="1" value="{{ item.series or '' }}">
        </div>
        <div class="field">
            <label for="reps">Reps</label>
            <input type="text" id="reps" name="reps" value="{{ item.reps or '' }}" placeholder="ex.: 8-10">
        </div>
        <div class="field">
            <label for="carga">Carga</label>
            <input type="text" id="carga" name="carga" value="{{ item.carga or '' }}" placeholder="ex.: 40 kg">
        </div>
    </div>

    <div class="field">
        <label for="observacao">Observação</label>
        <input type="text" id="observacao" name="observacao" value="{{ item.observacao or '' }}" placeholder="ex.: cadência lenta">
    </div>

    <p class="field-hint">O coach oferece caminhos — não gradua: a base, um passo atrás (regressão) e um passo adiante (progressão).</p>

    <div class="field">
        <label for="variacao_base">Base</label>
        <textarea id="variacao_base" name="variacao_base" rows="2">{{ item.variacao_base or '' }}</textarea>
    </div>
    <div class="field">
        <label for="variacao_regressao">Regressão</label>
        <textarea id="variacao_regressao" name="variacao_regressao" rows="2">{{ item.variacao_regressao or '' }}</textarea>
    </div>
    <div class="field">
        <label for="variacao_progressao">Progressão</label>
        <textarea id="variacao_progressao" name="variacao_progressao" rows="2">{{ item.variacao_progressao or '' }}</textarea>
    </div>

    <button type="submit">Salvar</button>
</form>

<p><a href="/alunos/{{ aluno.id }}/treino/{{ treino.id }}">Cancelar</a></p>
{% endblock %}
