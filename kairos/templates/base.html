<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kairos</title>
    <link rel="stylesheet" href="/static/css/tokens.css?v={{ asset_ver }}">
    <link rel="stylesheet" href="/static/css/base.css?v={{ asset_ver }}">
    <link rel="stylesheet" href="/static/css/shell.css?v={{ asset_ver }}">
    <link rel="stylesheet" href="/static/css/modal.css?v={{ asset_ver }}">
    <link rel="stylesheet" href="/static/css/components.css?v={{ asset_ver }}">
</head>
<body>
    {% set p = request.url.path %}
    <canvas id="fundo3d" aria-hidden="true"></canvas>
    <div id="fundo3d-scrim" aria-hidden="true"></div>
    <button id="fundo-toggle" type="button" hidden>pausar fundo</button>

    <header class="topbar">
        <div class="brand">
            <a class="brand-home" href="/vitrine" title="Voltar para a vitrine">
                <svg viewBox="0 0 100 100" aria-label="Kairos — ir para a vitrine">
                    <g class="ring"><circle cx="50" cy="50" r="46" fill="none" stroke="#c89b4a" stroke-width="0.6" stroke-dasharray="2 6" opacity="0.55"/></g>
                    <circle cx="50" cy="50" r="34" fill="none" stroke="#c2613f" stroke-width="1.6"/>
                    <line x1="50" y1="16" x2="50" y2="84" stroke="#f0ebe0" stroke-width="1" opacity="0.4"/>
                    <path d="M 50 50 Q 70 38 64 22" fill="none" stroke="#c89b4a" stroke-width="2.2" stroke-linecap="round"/>
                    <circle cx="50" cy="50" r="3.6" fill="#c2613f"/>
                </svg>
                <span class="word">Kair<span class="o">o</span>s</span>
            </a>
            <span class="sub">painel do coach</span>
        </div>
        <div class="topbar-user">
            <span class="coach">Jeffrey</span>
            <form method="post" action="/logout" class="logout-form">
                <button type="submit" class="logout-btn">Sair</button>
            </form>
        </div>
    </header>

    <nav class="tabs">
        <a class="tab{% if p == '/' %} on{% endif %}" href="/">Início</a>
        <a class="tab{% if p.startswith('/alunos') %} on{% endif %}" href="/alunos">Alunos</a>
        <a class="tab{% if p.startswith('/treinos') %} on{% endif %}" href="/treinos">Treinos</a>
        <a class="tab{% if p.startswith('/agenda') %} on{% endif %}" href="/agenda">Agenda</a>
        <a class="tab{% if p.startswith('/financeiro') %} on{% endif %}" href="/financeiro">Financeiro<span class="soon">em breve</span></a>
        <a class="tab{% if p.startswith('/conteudo') %} on{% endif %}" href="/conteudo">Conteúdo &amp; Comunicação<span class="soon">em breve</span></a>
    </nav>

    <main class="content">
        {% block content %}{% endblock %}
    </main>

    <script type="module" src="/static/js/painel-fundo.js?v={{ asset_ver }}"></script>
    <script type="module" src="/static/js/painel-tarefas.js?v={{ asset_ver }}"></script>
</body>
</html>
